<!doctype html><html lang="en" class="sys-page"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Prithvi — Sujit Roy</title><meta name="description" content="Prithvi EO and Prithvi WxC: NASA–IBM foundation models for Earth observation and for weather and climate."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script><link rel="stylesheet" href="../systems/system.css"></head><body class="sys-page"><div class="sys" style="--bg:url(../assets/sun/space_bg.jpg);--wash:rgba(40, 110, 170, 0.28);--copper:#5FB3E6;--hot:#2E8FD6"><div class="sys-room" aria-hidden="true"></div><div class="sys-vig" aria-hidden="true"></div><div class="sys-labels" aria-hidden="true"></div><canvas class="sys-space" aria-hidden="true"></canvas><div class="sys-tag"><b>Prithvi · Earth</b><span class="sys-tele">EARTH · 1.000 AU</span></div><p class="sys-credit">Imagery NASA Blue Marble · model output NASA / IBM</p><a class="sys-back" href="../#stop-system">← Back to the system</a><div class="sys-stage"><section class="screen screen-l" aria-live="polite"><div class="bar"><b class="screen-t">Prithvi EO</b><i></i></div><div class="content"></div></section><section class="screen screen-r" aria-live="polite"><div class="bar"><b class="screen-t">Lineage</b><i></i></div><div class="content"></div></section></div><p class="sys-cue">Scroll · Earth splits into the six HLS bands</p><nav class="sys-rail" aria-label="Scenes"><button class="on" data-scene="0"><i></i>Earth</button> <button data-scene="1"><i></i>Six bands</button> <button data-scene="2"><i></i>Atmosphere</button> <button data-scene="3"><i></i>Downstream</button></nav></div><div class="sys-track" aria-hidden="true"><div class="scene"></div><div class="scene"></div><div class="scene"></div><div class="scene"></div></div><template class="sys-scenes"><section data-left="Prithvi EO" data-right="Lineage" data-tele="EARTH · 1.000 AU · LAND"><div class="l"><h2>A foundation model for the land</h2><p>Prithvi EO is the NASA–IBM geospatial foundation model, pretrained on the Harmonized Landsat–Sentinel archive — petabytes of multispectral, multi-temporal imagery of every corner of Earth — and generalized across downstream tasks: floods, burn scars, crops, land cover.</p><p>Prithvi EO 2.0 scales the recipe to 600M parameters with temporal and location embeddings. AGU 2025 Open Science Award.</p><div class="links"><a href="https://huggingface.co/ibm-nasa-geospatial" target="_blank" rel="noopener">Hugging Face ↗</a><a href="https://doi.org/10.1109/TGRS.2025.3642610" target="_blank" rel="noopener">TGRS paper ↗</a></div><div class="tiles"><div class="tile"><b>600M</b><span>parameters · 2.0</span></div><div class="tile"><b>6</b><span>HLS bands</span></div><div class="tile"><b>~4 PB</b><span>HLS archive</span></div></div></div><div class="r"><figure><img src="../assets/prithvi-eo/prithvi_eo_ibm.gif" alt="Prithvi EO analysing satellite imagery of Earth, animated" loading="lazy"><figcaption>Prithvi EO over the HLS archive · animation IBM Research</figcaption></figure></div></section><section data-left="Six bands · many dates" data-right="One tile" data-tele="HLS · 30 M · 6 BANDS"><div class="l"><h2>Six bands. Every few days. Every place.</h2><p>Harmonized Landsat–Sentinel delivers blue, green, red, near-infrared and two shortwave-infrared bands at 30 m, revisiting each scene every two to three days. Prithvi reads a stack of dates at once, so a flood or a burn is a change in time, not just a pattern in space.</p><div class="chips" data-chips></div></div><div class="r"><div class="tiles"><div class="tile"><b>30 m</b><span>per pixel</span></div><div class="tile"><b>2–3 d</b><span>revisit</span></div><div class="tile"><b>75%</b><span>masked in pretraining</span></div></div><p>Masked-autoencoder pretraining on multi-temporal tiles: hide three quarters of Earth and learn to put it back. One frozen encoder, many lightweight task heads.</p><p class="lt">Band views on the platform are rendered from the Blue Marble composite over the Indus basin — the flood-mapping evaluation region.</p></div></section><section data-left="Prithvi WxC" data-right="Atmosphere" data-tele="EARTH · 1.000 AU · ATMOSPHERE"><div class="l"><h2>Then the air above it.</h2><p>Prithvi WxC is the weather and climate foundation model: 2.3B parameters trained on four decades of MERRA-2 reanalysis, forecasting up to 160 atmospheric variables. Rollout happens in latent space; neural-operator blocks respect the PDE structure of atmospheric flow.</p><p>One pretrained backbone serves forecasting, downscaling and parameterization.</p><div class="links"><a href="https://huggingface.co/collections/ibm-nasa-geospatial/prithvi-for-weather-and-climate" target="_blank" rel="noopener">Hugging Face ↗</a><a href="https://arxiv.org/abs/2409.13598" target="_blank" rel="noopener">WxC paper ↗</a></div><div class="tiles"><div class="tile"><b>2.3B</b><span>parameters</span></div><div class="tile"><b>160</b><span>variables</span></div><div class="tile"><b>40 yr</b><span>MERRA-2</span></div></div></div><div class="r"><figure><video src="../assets/prithvi-wxc/wxc_u500_winds.mp4" poster="../assets/prithvi-wxc/wxc_u500_winds.jpg" autoplay muted loop playsinline aria-label="Prithvi WxC predicting global winds at 500 hectopascals"></video><figcaption>WxC predicting global 500 hPa winds</figcaption></figure><p>The flow on the platform is the idea, not the data: jets streaming around a graticule. The screen shows the model's own output.</p></div></section><section data-left="Downstream" data-right="Impact" data-tele="PRITHVI · DOWNSTREAM"><div class="l"><h2>One backbone. Floods, fires, storms.</h2><ul class="ds"><li><b>Flood extent mapping</b> — HLS fine-tunes that earned the NASA PLANET award and Center Honor Award</li><li><b>Wildfire burn scars</b> — temporal segmentation of fire damage from orbit</li><li><b>3D forest structure</b> — canopy height from multi-modal time series, NASA ROSES award</li><li><b>Hurricane track &amp; intensity</b> — tropical-cyclone forecasting with WxC (JAMES, 2025)</li><li><b>Gravity-wave parameterization</b> — ML simulation of nonlocal propagation (ICML 2024)</li></ul><div class="links"><a href="https://doi.org/10.1029/2024MS004822" target="_blank" rel="noopener">Hurricane paper ↗</a></div></div><div class="r"><figure><video src="../assets/prithvi-wxc/wxc_hurricane_laura.mp4" poster="../assets/prithvi-wxc/wxc_hurricane_laura.jpg" autoplay muted loop playsinline aria-label="Prithvi WxC predicting sea-level pressure through Hurricane Laura, 2020"></video><figcaption>WxC through Hurricane Laura, 2020 · sea-level pressure</figcaption></figure><p>Multi-sensor super-resolution (ICCV Workshops 2025), Clifford neural operators for atmospheric PDEs and the WINDSET suite (ICLR 2024) round out the Earth work.</p></div></section></template><script type="module">import{createSystem}from"../systems/system.js";import world from"./world.js";createSystem(world)</script></body></html>
