<!doctype html><html lang="en" class="sys-page"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lunar FM — Sujit Roy</title><meta name="description" content="The NASA–IBM Lunar Foundation Model: a multimodal, multiresolution model for lunar remote sensing, pretrained from scratch on 11 modalities at 1 m and 100 m."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script><link rel="stylesheet" href="../systems/system.css"></head><body class="sys-page"><div class="sys" style="--bg:url(../assets/sun/space_bg.jpg);--wash:rgba(150, 160, 180, 0.16);--copper:#C9D1E0;--hot:#9AA6BC"><div class="sys-room" aria-hidden="true"></div><div class="sys-vig" aria-hidden="true"></div><div class="sys-labels" aria-hidden="true"></div><canvas class="sys-space" aria-hidden="true"></canvas><div class="sys-tag"><b>Lunar FM · the Moon</b><span class="sys-tele">LUNA · 1.0026 AU</span></div><p class="sys-credit">Imagery NASA LRO · LROC WAC + LOLA · SVS CGI Moon Kit</p><a class="sys-back" href="../#stop-system">← Back to the system</a><div class="sys-stage"><section class="screen screen-l" aria-live="polite"><div class="bar"><b class="screen-t">Lunar FM</b><i></i></div><div class="content"></div></section><section class="screen screen-r" aria-live="polite"><div class="bar"><b class="screen-t">At a glance</b><i></i></div><div class="content"></div></section></div><p class="sys-cue">Scroll · the Moon splits into its modalities</p><nav class="sys-rail" aria-label="Scenes"><button class="on" data-scene="0"><i></i>The Moon</button> <button data-scene="1"><i></i>Modalities</button> <button data-scene="2"><i></i>Architecture</button> <button data-scene="3"><i></i>Benchmarks</button></nav></div><div class="sys-track" aria-hidden="true"><div class="scene"></div><div class="scene"></div><div class="scene"></div><div class="scene"></div></div><template class="sys-scenes"><section data-left="Lunar FM" data-right="At a glance" data-tele="LUNA · 1.0026 AU"><div class="l"><h2>A foundation model for the Moon</h2><p>The NASA–IBM Lunar Foundation Model: a TerraMind-style masked-token model pretrained from scratch on SomBench — nearly two million co-registered tile bundles across 11 modalities at 1 m and 100 m per pixel. No Earth weights, no ImageNet.</p><p>Two lunar extensions: acquisition geometry supplied as explicit context, and joint fine/coarse training so one set of weights serves both scales.</p><div class="links"><a href="https://arxiv.org/abs/2609.13283" target="_blank" rel="noopener">Paper · arXiv 2609.13283 ↗</a></div></div><div class="r"><div class="tiles"><div class="tile"><b>11</b><span>modalities</span></div><div class="tile"><b>2</b><span>scales · 1 m + 100 m</span></div><div class="tile"><b>~2M</b><span>tile bundles</span></div></div><p>Dozens of instruments have mapped the Moon — cameras, altimeters, radar, thermal sensors — each at its own scale. The model learns all of them together, and knows where the Sun was when each picture was taken, so it can tell a shadow from a crater.</p><p class="lt">The light on the platform moves: watch the terminator and the shadows follow it.</p></div></section><section data-left="11 modalities · 2 scales" data-right="SomBench" data-tele="SOMBENCH · 11 MODALITIES"><div class="l"><h2>Every patch of the Moon, eleven ways.</h2><p>SomBench is geographically partitioned, every tile bundle aligned across imagery, topography, slope, illumination, radar and thermal products. FlexiViT patch embeddings and modality-wise inputs let the same weights run at 1 m or 100 m without retraining.</p><div class="chips" data-chips></div></div><div class="r"><div class="tiles"><div class="tile"><b>1 m</b><span>NAC scale</span></div><div class="tile"><b>100 m</b><span>WAC scale</span></div><div class="tile"><b>2</b><span>illuminations shown</span></div></div><p><b>Geometry is an input, not noise.</b> Sun and view angles enter as explicit context; the model generates illumination-consistent reflectance from terrain and sun angle alone.</p><p class="lt">Platform tiles are one southern-highlands site: LROC WAC colour, LOLA elevation, slope and two hillshades (low morning sun, high afternoon sun) derived from the LOLA DEM.</p></div></section><section data-left="Architecture" data-right="Blocks" data-tele="MASKED TOKENS · FROM SCRATCH"><div class="l"><h2>Masked tokens. Learned from scratch.</h2><p>Modality-wise FlexiViT tokens at both scales, plus a geometry context, feed a masked-token encoder trained with the TerraMind recipe — on the Moon only. Three ways out: cross-modal generation, LoRA fine-tuning, full fine-tuning.</p><p><b>LoRA matches or beats full fine-tuning</b> on crater detection and IMP segmentation with far fewer trained parameters.</p></div><div class="r"><p><b>11 modalities + geometry</b> → <b>FlexiViT tokens · 1 m + 100 m</b> → <b>masked-token encoder</b> → <b>generation · LoRA · full fine-tuning</b></p><p>Hide tokens across modalities and scales; learn to put the Moon back together. The geometry context is what lets a shadow be explained rather than memorized.</p></div></section><section data-left="Four benchmarks" data-right="Half the data" data-tele="SOMBENCH · 4 BENCHMARKS"><div class="l"><h2>Four benchmarks. Half the data.</h2><ul class="ds"><li><b>Crater detection · WAC</b> — on 50% of the data beats the strongest ImageNet baseline trained on all of it</li><li><b>Crater detection · NAC</b> — the same recipe at 1 m</li><li><b>Irregular mare patch segmentation</b> — pretrained matches or beats ImageNet and random-init controls</li><li><b>Polar ice prospectivity</b> — multimodal regression; pretrained variants perform best</li></ul><div class="links"><a href="https://arxiv.org/abs/2609.13283" target="_blank" rel="noopener">Paper ↗</a></div></div><div class="r"><div class="tiles"><div class="tile"><b>50%</b><span>of the data · WAC craters</span></div><div class="tile"><b>4</b><span>SomBench tasks</span></div><div class="tile"><b>0</b><span>Earth weights</span></div></div><p>Checkpoint, benchmarks and fine-tuning code released. NASA IMPACT · IBM Research.</p></div></section></template><script type="module">import{createSystem}from"../systems/system.js";import world from"./world.js";createSystem(world)</script></body></html>
