<!doctype html><html lang="en" class="sys-page"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Surya — Sujit Roy</title><meta name="description" content="Surya, NASA's heliophysics foundation model: 1.0 to 2.0, 13 SDO channels at native resolution, 3.4 million tokens per snapshot."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script><link rel="stylesheet" href="../systems/system.css"></head><body class="sys-page"><div class="sys" style="--bg:url(../assets/sun/space_bg.jpg);--copper:#E8A15A;--hot:#FF5A1F"><div class="sys-room" aria-hidden="true"></div><div class="sys-vig" aria-hidden="true"></div><div class="sys-labels" aria-hidden="true"></div><canvas class="sys-space" aria-hidden="true"></canvas><div class="sys-tag"><b>Surya · the Sun</b><span class="sys-tele">SOL · 0.000 AU</span></div><p class="sys-credit">Imagery NASA / SDO · AIA + HMI · 21 Sep 2026</p><a class="sys-back" href="../#stop-system">← Back to the system</a><div class="sys-stage"><section class="screen screen-l" aria-live="polite"><div class="bar"><b class="screen-t">Surya</b><i></i></div><div class="content"></div></section><section class="screen screen-r" aria-live="polite"><div class="bar"><b class="screen-t">Lineage</b><i></i></div><div class="content"></div></section></div><p class="sys-cue">Scroll · how Surya 1.0 read the Sun, and what 2.0 changed</p><nav class="sys-rail" aria-label="Scenes"><button class="on" data-scene="0"><i></i>The Sun</button> <button data-scene="1"><i></i>Surya 1.0</button> <button data-scene="2"><i></i>Surya 2.0</button> <button data-scene="3"><i></i>Architecture</button> <button data-scene="4"><i></i>Results</button></nav></div><div class="sys-track" aria-hidden="true"><div class="scene"></div><div class="scene"></div><div class="scene"></div><div class="scene"></div><div class="scene"></div></div><template class="sys-scenes"><section data-left="Surya 1.0" data-right="Lineage" data-tele="SOL · 0.000 AU"><div class="l"><h2>A foundation model for the Sun</h2><p>Trained on the full Solar Dynamics Observatory archive — a picture every 12 minutes since 2010, 13 channels, 4096×4096. Long–short transformer with frequency-based attention, scaled on HPC.</p><p>Surya 1.0 forecasts the corona and set new marks on flare prediction. Surya 2.0 reads the Sun at native resolution.</p><div class="links"><a href="https://huggingface.co/nasa-ibm-ai4science" target="_blank" rel="noopener">Model on Hugging Face ↗</a><a href="https://arxiv.org/abs/2508.14112" target="_blank" rel="noopener">Surya 1.0 · arXiv ↗</a><a href="https://doi.org/10.1038/s41597-026-06552-5" target="_blank" rel="noopener">SuryaBench ↗</a></div><div class="tiles"><div class="tile"><b>366M</b><span>parameters · 1.0</span></div><div class="tile"><b>+16%</b><span>flare-forecast skill</span></div><div class="tile"><b>13</b><span>channels · 12-min</span></div></div></div><div class="r"><figure><div class="crop"><img src="../assets/surya/surya_aia171_rollout.gif" alt="Surya forecasting the Sun in AIA 171 ångström, an animated autoregressive rollout" loading="lazy"></div><figcaption>Surya 1.0 · autoregressive rollout · AIA 171 Å</figcaption></figure><p>1.0 learned the Sun by forecasting it: given the recent frames, predict the next. The rollout above is that model running forward on its own.</p></div></section><section data-left="How 1.0 read the Sun" data-right="The 1.0 recipe" data-tele="SURYA 1.0 · SPECTFORMER"><div class="l"><h2>Thirteen channels, one tensor.</h2><p>Surya 1.0 stacked the eight AIA and five HMI channels into a single 13-channel image, patchified it once, and read the whole disc with a SpectFormer: spectral gating in the early blocks, long–short attention in the rest — a sliding window for fine structure, a compressed long-range path for the global field. Trained to forecast the next frame.</p><p>It worked: 366M parameters, the first full-disc foundation model, new marks on flare forecasting.</p></div><div class="r"><p><b>stack 13 channels</b> → <b>one patch grid</b> → <b>spectral gating</b> → <b>long–short attention</b> → <b>next frame</b></p><p><b>What the stack costs.</b> Every channel shares one embedding, so 94 Å plasma and an HMI magnetogram are blended before the model sees them. One patch grid over 4096² means coarse tokens or a very long sequence. And a representation learned to forecast is tuned to forecasting.</p><div class="tiles"><div class="tile"><b>13 → 1</b><span>channels into one tensor</span></div><div class="tile"><b>LS</b><span>long–short attention</span></div><div class="tile"><b>t + 1</b><span>forecast pretext</span></div></div></div></section><section data-left="Surya 2.0 · what changed" data-right="Why" data-tele="SURYA 2.0 · 13 MODALITIES"><div class="l"><h2>2.0 undoes the stack.</h2><p>Each of the 13 channels — eight AIA wavelengths from 94 Å plasma at millions of degrees to the 1600 Å photosphere, five HMI magnetic products — becomes its own modality with its own adapter, patchified at 8×8 on the native 4096² grid. Nothing downsampled, nothing blended. And the pretext changes: not forecasting but reconstruction — hide most of every channel, rebuild all 13.</p><div class="chips" data-chips></div></div><div class="r"><div class="tiles"><div class="tile"><b>3.4M</b><span>tokens / snapshot</span></div><div class="tile"><b>8×8</b><span>patches · no downsampling</span></div><div class="tile"><b>257 TB</b><span>15 years of SDO</span></div></div><p><b>Why.</b> Channels carry different physics, so they deserve different embeddings. Separate modalities mean any subset works — a task with only AIA, or only HMI, still has a model. Native 8×8 patches keep the small structures that flares begin as: <b>3,407,872 tokens</b> per snapshot, 13 × (4096 / 8)². And reconstruction, not forecasting, gives one frozen encoder that serves every downstream task — a forecaster you would otherwise have to retrain.</p></div></section><section data-left="Architecture" data-right="Beyond 3 million tokens" data-tele="SURYA 2.0 · ENCODER"><div class="l"><h2>See 25%. Project the rest.</h2><p>Random Fourier Projection replaces token dropping: a quarter of the patches stay sharp, three quarters become random Fourier views, and the encoder sees the whole context. Sequence- and feature-parallel, FP8, scaling to 1,024 GPUs.</p><p><b>Hide 90% of every channel</b> and the frozen model rebuilds all 13, zero-shot.</p></div><div class="r"><p><b>13 adapters</b> → <b>patchify 8×8</b> → <b>25% kept · 75% RFP</b> → <b>encoder</b> (sequence ∥ feature parallel) → <b>13-channel decode</b></p><p>Random Fourier Projection keeps the full 3M-token context without dropping tokens; the projected 75% still carry signal. One frozen encoder serves every downstream task.</p><div class="pull"><p>"It carries the imprint of late nights, stubborn bugs, and weekend experiments."</p><cite>— on building Surya, NASA Science Data Portal</cite></div></div></section><section data-left="Results" data-right="Frozen encoder" data-tele="SURYA 2.0 · RESULTS"><div class="l"><h2>One frozen encoder. New state of the art.</h2><p>Use any 1, 2… or all 13 channels. No retraining per task.</p><ul class="ds"><li><b>Active-region segmentation</b> — +9.5% Dice with the frozen encoder</li><li><b>EVE irradiance</b> — 10.4% lower MAE</li><li><b>Flare forecasting</b> — SuryaBench finetunes for flare onset (Nature Scientific Data, 2026)</li></ul><div class="links"><a href="https://huggingface.co/nasa-ibm-ai4science" target="_blank" rel="noopener">Hugging Face ↗</a><a href="https://doi.org/10.1038/s41597-026-06552-5" target="_blank" rel="noopener">SuryaBench ↗</a></div></div><div class="r"><div class="tiles"><div class="tile"><b>34×</b><span>lower AIA recon error</span></div><div class="tile"><b>+9.5%</b><span>Dice · AR seg</span></div><div class="tile"><b>−10.4%</b><span>MAE · EVE</span></div></div><p>"Beyond 3 Million Tokens" — a multi-modal foundation model for full-resolution heliophysics. <b>NeurIPS 2026.</b></p><p>UAH · NASA IMPACT · IBM Research · NVIDIA · Edinburgh · Georgia State · Swift</p></div></section></template><script type="module">import{createSystem}from"../systems/system.js";import world from"./world.js";createSystem(world)</script></body></html>
