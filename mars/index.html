<!doctype html><html lang="en" class="sys-page"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MAFM — Sujit Roy</title><meta name="description" content="MAFM, the Mars Atmosphere Foundation Model: a perspective paper charting the path, and a V0 proof of concept in development with NASA, UAH and IBM Research."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script><link rel="stylesheet" href="../systems/system.css"></head><body class="sys-page"><div class="sys" style="--bg:url(../assets/sun/space_bg.jpg);--wash:rgba(200, 90, 40, 0.22);--copper:#E07A4A;--hot:#C94F2A"><div class="sys-room" aria-hidden="true"></div><div class="sys-vig" aria-hidden="true"></div><div class="sys-labels" aria-hidden="true"></div><canvas class="sys-space" aria-hidden="true"></canvas><div class="sys-tag"><b>MAFM · Mars</b><span class="sys-tele">MARS · 1.524 AU</span></div><p class="sys-credit">Imagery Solar System Scope (CC BY 4.0) from NASA / USGS data</p><a class="sys-back" href="../#stop-system">← Back to the system</a><div class="sys-stage"><section class="screen screen-l" aria-live="polite"><div class="bar"><b class="screen-t">MAFM</b><i></i></div><div class="content"></div></section><section class="screen screen-r" aria-live="polite"><div class="bar"><b class="screen-t">Status</b><i></i></div><div class="content"></div></section></div><p class="sys-cue">Scroll · the orbiters start sweeping</p><nav class="sys-rail" aria-label="Scenes"><button class="on" data-scene="0"><i></i>Mars</button> <button data-scene="1"><i></i>Data</button> <button data-scene="2"><i></i>Curriculum</button> <button data-scene="3"><i></i>Tasks</button></nav></div><div class="sys-track" aria-hidden="true"><div class="scene"></div><div class="scene"></div><div class="scene"></div><div class="scene"></div></div><template class="sys-scenes"><section data-left="MAFM" data-right="Status" data-tele="MARS · 1.524 AU"><div class="l"><h2>A weather model for another world</h2><p>The Mars Atmosphere Foundation Model. Mars has weather too — dust storms that can swallow the entire planet — and the missions that will land, fly and live there need a forecaster. A perspective paper charts the path; the V0 proof of concept is in development with NASA, UAH and IBM Research.</p><div class="links"><a href="https://arxiv.org/abs/2605.28851" target="_blank" rel="noopener">Perspective paper · arXiv 2605.28851 ↗</a></div></div><div class="r"><div class="tiles"><div class="tile"><b>V0</b><span>in development</span></div><div class="tile"><b>CO₂</b><span>thin atmosphere</span></div><div class="tile"><b>1.52</b><span>AU from the Sun</span></div></div><p>The real experiment: does the Earth-proven foundation-model recipe transfer to a thin CO₂ atmosphere, with a fraction of the observations?</p><p class="lt">The haze on the platform is the dusty lower atmosphere, drawn from the surface albedo.</p></div></section><section data-left="Three kinds of data" data-right="Data-poor by design" data-tele="OPENMARS · ORBITERS · GCM"><div class="l"><h2>Reanalysis, orbiters, simulation.</h2><p>Three sources feed the model: the OpenMARS reanalysis, raw orbiter observations — narrow tracks that sweep the planet one orbit at a time — and global circulation model runs. Compared with Earth's forty years of dense reanalysis, Mars is data-poor by design, and the pretext tasks have to respect that.</p><div class="chips" data-chips></div></div><div class="r"><div class="tiles"><div class="tile"><b>3</b><span>data sources</span></div><div class="tile"><b>orbit</b><span>tracks as masks</span></div><div class="tile"><b>GCM</b><span>simulation runs</span></div></div><p>Orbiter instruments see the atmosphere in strips. Masking along those strips, rather than at random, trains the model on the gaps it will meet in practice.</p></div></section><section data-left="Curriculum" data-right="Blocks" data-tele="MAFM V0 · CURRICULUM"><div class="l"><h2>Reanalysis → observations → simulation.</h2><p>Curriculum pretraining runs from the smooth, complete reanalysis to raw observations to GCM output, so the model first learns the planet's dynamics and then learns to read sparse, noisy instruments against them.</p><p>One pretrained backbone, then the Mars tasks: dust storms, circulation, entry-descent-landing support.</p></div><div class="r"><p><b>OpenMARS · orbiter obs · GCM runs</b> → <b>curriculum pretraining</b> → <b>MAFM V0</b> → <b>dust storms · circulation · EDL support</b></p><p>The V0 recipe is deliberately the Earth one — Prithvi WxC's lineage — so the question stays clean: is it the atmosphere that changes, or the method?</p></div></section><section data-left="Mars tasks" data-right="Why" data-tele="MAFM · TASKS"><div class="l"><h2>Dust, wind, and a safe landing.</h2><ul class="ds"><li><b>Martian weather prediction</b> — forecasting from OpenMARS, raw orbiter observations and GCM runs</li><li><b>Dust storms</b> — the hazard that grounds solar-powered missions</li><li><b>Circulation</b> — the planet's thin, fast atmosphere</li><li><b>Entry, descent and landing</b> — density and wind where it matters most</li></ul><div class="links"><a href="https://arxiv.org/abs/2605.28851" target="_blank" rel="noopener">Perspective paper ↗</a></div></div><div class="r"><p>MAFM is one of three flagship efforts under NASA IMPACT's AI4Science umbrella, alongside Prithvi and Surya — the first step toward a weather forecaster for another world, built for the missions that will need one.</p><p class="status"><span class="dot"></span>V0 in development</p></div></section></template><script type="module">import{createSystem}from"../systems/system.js";import world from"./world.js";createSystem(world)</script></body></html>
